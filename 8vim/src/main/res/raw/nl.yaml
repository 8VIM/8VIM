version: "2"
layers:
  default:
    sectors:
      right:
        parts:
          bottom:
            - lower_case: n
            - lower_case: m
            - lower_case: f
            - lower_case: "!"
              upper_case: "!!!"
          top:
            - lower_case: a
            - lower_case: r
            - lower_case: x
            - lower_case: "?"
              upper_case: "*"
      top:
        parts:
          right:
            - lower_case: y
            - lower_case: b
            - lower_case: p
            - lower_case: q
          left:
            - lower_case: s
            - lower_case: d
            - lower_case: g
            - lower_case: "'"
              upper_case: '"'
      left:
        parts:
          top:
            - lower_case: t
            - lower_case: c
            - lower_case: z
            - lower_case: .
              upper_case: "-"
          bottom:
            - lower_case: i
            - lower_case: h
            - lower_case: j
            - lower_case: ","
              upper_case: _
      bottom:
        parts:
          left:
            - lower_case: e
            - lower_case: l
            - lower_case: k
            - lower_case: "@"
              upper_case: "@gmail.com"
          right:
            - lower_case: o
            - lower_case: u
            - lower_case: v
            - lower_case: w
  extra_layers:
    first:
      sectors:
        right:
          parts:
            top:
              - lower_case: "ä"
        left:
          parts:
            bottom:
              - lower_case: "ï"
            top:
              - null
              - lower_case: "€"
                upper_case: "¢"
        bottom:
          parts:
            left:
              - lower_case: "ë"
            right:
              - lower_case: "ö"
              - lower_case: "ü"
    second:
      sectors:
        right:
          parts:
            top:
              - lower_case: "á"
        left:
          parts:
            bottom:
              - lower_case: "í"
              - null
              - lower_case: "ȷ́"
                upper_case: "J́"
            top:
              - null
              - lower_case: "ç"
        bottom:
          parts:
            left:
              - lower_case: "é"
            right:
              - lower_case: "ó"
              - lower_case: "ú"
    third:
      sectors:
        right:
          parts:
            top:
              - lower_case: "à"
        left:
          parts:
            bottom:
              - lower_case: "ì"
        bottom:
          parts:
            left:
              - lower_case: "è"
            right:
              - lower_case: "ò"
              - lower_case: "ù"
    fourth:
      sectors:
        right:
          parts:
            top:
              - lower_case: "â"
        left:
          parts:
            bottom:
              - lower_case: "î"
        bottom:
          parts:
            left:
              - lower_case: "ê"
            right:
              - lower_case: "ô"
              - lower_case: "û"
